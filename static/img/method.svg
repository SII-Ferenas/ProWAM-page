<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="mt md">
  <title id="mt">ProWAM architecture</title>
  <desc id="md">A video expert emits progress-indexed sub-goals from the current observation and instruction; an action expert attends to them to emit an action chunk, while the video branch never attends to action tokens.</desc>
  <defs>
    <linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#00a2e8"/><stop offset="1" stop-color="#dc1e1e"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7484"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00a2e8"/></marker>
  </defs>

  <rect x="34" y="150" width="120" height="74" fill="#12141d" stroke="#22262f" stroke-width="1.5" rx="10"/>
  <text x="94" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#e9ecf2" text-anchor="middle">Observation</text>
  <text x="94" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#61bdde" text-anchor="middle">r = 0</text>
  <text x="94" y="243" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">&#8220;put the bowl</text>
  <text x="94" y="257" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">on the stove&#8221;</text>

  <path d="M162 187 H200" stroke="#6b7484" stroke-width="1.6" fill="none"/>
  <path d="M200 187 V129 H208" stroke="#6b7484" stroke-width="1.6" marker-end="url(#ah)" fill="none"/>
  <path d="M200 187 V271 H208" stroke="#6b7484" stroke-width="1.6" marker-end="url(#ah)" fill="none"/>

  <rect x="216" y="98" width="152" height="62" fill="#12141d" stroke="#00a2e8" stroke-opacity="0.45" stroke-width="1.5" rx="10"/>
  <text x="292" y="125" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#e9ecf2" text-anchor="middle">Video expert</text>
  <text x="292" y="144" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">one cached pass</text>

  <rect x="216" y="240" width="152" height="62" fill="#12141d" stroke="#dc1e1e" stroke-opacity="0.4" stroke-width="1.5" rx="10"/>
  <text x="292" y="267" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#e9ecf2" text-anchor="middle">Action expert</text>
  <text x="292" y="286" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">denoised per step</text>

  <text x="561" y="62" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#9aa3b2" text-anchor="middle">Ordered chain of sub-goals</text>
  <line x1="410" y1="80" x2="712" y2="80" stroke="#2c6a86" stroke-width="2.5"/>
  <line x1="410" y1="80" x2="712" y2="80" stroke="url(#pg)" stroke-width="2.5"/>
  <path d="M376 129 H402" stroke="#00a2e8" stroke-width="1.6" marker-end="url(#ahb)" fill="none"/>

  <rect x="410" y="96" width="62" height="62" fill="#12141d" stroke="#00a2e8" stroke-opacity="0.85" stroke-width="1.5" rx="9"/>
  <text x="441" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#61bdde" text-anchor="middle">G1</text>
  <text x="441" y="174" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">r=0.1</text>
  <rect x="490" y="96" width="62" height="62" fill="#12141d" stroke="#00a2e8" stroke-opacity="0.62" stroke-width="1.5" rx="9"/>
  <text x="521" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#61bdde" text-anchor="middle">G2</text>
  <text x="521" y="174" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">r=0.3</text>
  <rect x="570" y="96" width="62" height="62" fill="#12141d" stroke="#00a2e8" stroke-opacity="0.45" stroke-width="1.5" rx="9"/>
  <text x="601" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#61bdde" text-anchor="middle">G3</text>
  <text x="601" y="174" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">r=0.7</text>
  <rect x="650" y="96" width="62" height="62" fill="#12141d" stroke="#00a2e8" stroke-opacity="0.3" stroke-width="1.5" rx="9"/>
  <text x="681" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#61bdde" text-anchor="middle">G4</text>
  <text x="681" y="174" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="middle">r=0.9</text>

  <path d="M561 166 V232" stroke="#00a2e8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahb)" fill="none"/>
  <text x="574" y="204" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#61bdde">actions attend to sub-goals</text>

  <rect x="410" y="240" width="302" height="62" fill="#12141d" stroke="#dc1e1e" stroke-opacity="0.55" stroke-width="1.5" rx="10"/>
  <text x="561" y="267" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#e9ecf2" text-anchor="middle">Action chunk</text>
  <text x="561" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#f1a29f" text-anchor="middle">a0 ... aH</text>
  <path d="M376 271 H402" stroke="#6b7484" stroke-width="1.6" marker-end="url(#ah)" fill="none"/>

  <path d="M735 271 H772 V192 H735" stroke="#3a4250" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <text x="786" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484">video never attends</text>
  <text x="786" y="201" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484">to action tokens</text>
  <text x="786" y="219" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#61bdde">&#8594; sub-goal KV cache</text>

  <line x1="34" y1="344" x2="966" y2="344" stroke="#22262f" stroke-width="1"/>
  <text x="34" y="371" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484">Stage 1 &#8212; action-free video, sub-goal loss only</text>
  <text x="966" y="371" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6b7484" text-anchor="end">Stage 2 &#8212; robot demos, video + action jointly</text>
</svg>
